<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>EnterpriseSys - Iniciar sesión</title>
    <link rel="stylesheet" href="/css/login.css" />
  </head>

  <body>
    <main class="login-container">
      <!-- Panel del formulario -->
      <section class="form-section">
        <form id="formularioLogin" class="login-form">
          <h1>Iniciar sesión</h1>

          <div class="input-group">
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Usuario"
              autocomplete="username"
              aria-label="Usuario"
              required
            />
          </div>

          <div class="input-group">
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Contraseña"
              autocomplete="current-password"
              aria-label="Contraseña"
              required
            />
          </div>

          <button type="submit" id="btnIngresar">Ingresar</button>

          <p id="mensaje" role="status" aria-live="polite"></p>
        </form>
      </section>

      <!-- Panel de bienvenida -->
      <section class="welcome-section">
        <div class="welcome-content">
          <p>Bienvenido a</p>
          <h2>EnterpriseSys</h2>
        </div>
      </section>
    </main>

    <script>
      const formulario = document.getElementById("formularioLogin");
      const mensaje = document.getElementById("mensaje");
      const btnIngresar = document.getElementById("btnIngresar");

      formulario.addEventListener("submit", async (event) => {
        event.preventDefault();

        const username = document.getElementById("username").value;
        const password = document.getElementById("password").value;

        mensaje.textContent = "";
        btnIngresar.disabled = true;
        btnIngresar.textContent = "Ingresando...";

        try {
          const respuesta = await fetch(
            "http://localhost:3000/usuarios/login",
            {
              method: "POST",
              headers: {
                "Content-Type": "application/json",
              },
              body: JSON.stringify({
                username: username,
                password: password,
              }),
            },
          );

          const datos = await respuesta.json();

          mensaje.textContent = datos.mensaje || "No se pudo iniciar sesión.";

          if (respuesta.ok) {
            console.log("Usuario:", datos.usuario);
            console.log("Rol:", datos.usuario.nombre_rol);

            window.location.href = "/inicio";
          }
        } catch (error) {
          console.error(error);
          mensaje.textContent = "No se pudo conectar con el servidor.";
        } finally {
          btnIngresar.disabled = false;
          btnIngresar.textContent = "Ingresar";
        }
      });
    </script>
  </body>
</html>
